name: Farm reminder scheduler
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: farm-reminder-scheduler
  cancel-in-progress: false
jobs:
  dispatch:
    if: vars.REMINDERS_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invoke the authorized Preview scheduler
        env:
          REMINDERS_URL: ${{ vars.REMINDERS_URL }}
          REMINDERS_CRON_KEY: ${{ secrets.REMINDERS_CRON_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node --input-type=module <<'JS'
          const url=new URL(process.env.REMINDERS_URL);
          if(url.origin!=='https://livestock-m8-preview-loris-projects-8253d8e3.vercel.app'||url.pathname!=='/api/reminders'||url.search||url.hash)throw Error('Unexpected scheduler target');
          const key=process.env.REMINDERS_CRON_KEY;
          if(!/^[A-Za-z0-9_-]{43}$/.test(key??''))throw Error('Scheduler secret unavailable');
          const headers={Authorization:'Bearer '+key,'Content-Type':'application/json'};
          if(process.env.VERCEL_AUTOMATION_BYPASS_SECRET)headers['x-vercel-protection-bypass']=process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          const response=await fetch(url,{method:'POST',headers,body:'{}',redirect:'error',signal:AbortSignal.timeout(60000)});
          if(!response.ok)throw Error('Scheduler request failed: '+response.status);
          const result=await response.json();
          if(!Number.isInteger(result.checked)||!Number.isInteger(result.accepted))throw Error('Unexpected scheduler response');
          console.log('Authorized scheduler completed.');
          JS
